<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function(){
      const _store = {};
      window.localStorage = {
        getItem: function(k){ return Object.prototype.hasOwnProperty.call(_store,k) ? _store[k] : null; },
        setItem: function(k,v){ _store[k]=String(v); },
        removeItem: function(k){ delete _store[k]; },
        clear: function(){ for (let k in _store) { if (Object.prototype.hasOwnProperty.call(_store,k)) delete _store[k]; } }
      };
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      width: 350px;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #ff9933;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #ff9933;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #e68a00;
    }
    p {
      margin-top: 15px;
      font-size: 14px;
    }
    a {
      color: #ff9933;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Forgot Password</h2>
    <form>
      <div class="form-group">
        <label for="email">Enter your registered Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>
      <button type="submit">Reset Password</button>
    </form>
    <p>Remembered your password? <a href="{{ url_for('home') }}">Login here</a></p>
    <p>Don't have an account? <a href="{{ url_for('register') }}">Create Account</a></p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>
</head>
<body>
  <h2>Reset Password</h2>
  <form method="POST">
    <input type="password" name="password" placeholder="New Password" required>
    <button type="submit">Update Password</button>
  </form>
</body>
</html>
